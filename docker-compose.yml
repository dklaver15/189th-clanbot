version: "3.8"

services:
  clanguard:
    build: .
    container_name: clanguard-bot
    restart: unless-stopped
    environment:
      - DOTNET_ENVIRONMENT=Production
      - BotConfig__Token=${DISCORD_BOT_TOKEN}
      - Claude__ApiKey=${ANTHROPIC_API_KEY}
      # Reddit lead service. The non-secret fields stay in appsettings.json
      # (ClientId, Username, UserAgent, Subreddits) so they're visible in the
      # repo for review. Secrets come in here from GitHub Actions secrets.
      - RedditLeads__ClientSecret=${REDDIT_CLIENT_SECRET}
      - RedditLeads__Password=${REDDIT_PASSWORD}
      # Override any config values via environment variables:
      # - BotConfig__HqChannelName=headquarters
      # - BotConfig__MinMessages=10
      # - BotConfig__ExemptRoles=Admin,Moderator,Officer,Bot,VIP
    volumes:
      - bot-data:/app/data
      - bot-logs:/app/logs
      - ./google-credentials.json:/app/google-credentials.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
  bot-logs: