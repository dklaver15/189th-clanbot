services:
  clanguard:
    build:
      context: .
      # ImageSharp's build-time license key; the deploy writes sixlabors.lic.
      secrets:
        - sixlabors_license
    container_name: clanguard-bot
    restart: unless-stopped
    # -- Memory limits --
    # Sized for the 2 GB droplet: 640 + 640 + 256 = 1536m for containers,
    # leaving ~512m for the host OS and the Docker daemon. Without limits
    # every container sees the whole box, so a spike in one (the whisper
    # model in the transcriber, most likely) gets the OOM killer to pick a
    # victim by size, and that victim is this container.
    #
    # Idle draw is ~220MiB, so 640m is roughly 3x headroom. The spikes are
    # SkiaSharp/ScottPlot renders (XP leaderboard PNG, Satisfactory charts,
    # member activity charts); those allocate natively, outside the managed
    # heap, so they will not show up in .NET memory counters.
    #
    # memswap_limit is TOTAL memory + swap, not swap on its own. Setting it
    # to 896m allows 256m of swap: enough to ride out a render spike instead
    # of being killed, not enough to sit and thrash.
    mem_limit: 640m
    memswap_limit: 896m
    depends_on:
      - recorder
      - transcriber
    environment:
      - DOTNET_ENVIRONMENT=Production
      - BotConfig__Token=${DISCORD_BOT_TOKEN}
      - Claude__ApiKey=${ANTHROPIC_API_KEY}
      - BotConfig__BackupEncryptionPassphrase=${CLANGUARD_BACKUP_PASSPHRASE}
      - BotConfig__HeartbeatPingUrl=${CLANGUARD_HEARTBEAT_URL}
      # Cloudflare R2 credentials for the SQLite backup uploader.
      - BotConfig__BackupR2__AccessKeyId=${CLANGUARD_R2_ACCESS_KEY_ID}
      - BotConfig__BackupR2__SecretAccessKey=${CLANGUARD_R2_SECRET_ACCESS_KEY}
      # -- Google resource IDs + R2 endpoint (moved out of appsettings.json) --
      - BotConfig__GoogleSpreadsheetId=${CLANGUARD_GOOGLE_SPREADSHEET_ID}
      - BotConfig__RosterSpreadsheetId=${CLANGUARD_ROSTER_SPREADSHEET_ID}
      - BotConfig__RecruitSpreadsheetId=${CLANGUARD_RECRUIT_SPREADSHEET_ID}
      - BotConfig__GoogleCalendarId=${CLANGUARD_GOOGLE_CALENDAR_ID}
      - BotConfig__BackupDriveFolderId=${CLANGUARD_BACKUP_DRIVE_FOLDER_ID}
      - BotConfig__BackupR2__AccountEndpoint=${CLANGUARD_R2_ACCOUNT_ENDPOINT}
      - BotConfig__BackupR2__Bucket=${CLANGUARD_R2_BUCKET}
      # -- Satisfactory Dedicated Server --
      # A credential for the game's HTTPS API. Set ONE of these: the Admin Password
      # (exchanged for a token via PasswordLogin), or a pre-generated Application
      # token from `server.GenerateAPIToken`. Either grants save/shutdown/run-command,
      # so keep it out of git. Base URL is the same IP:port players use in-game,
      # prefixed https:// (set BotConfig__SatisfactoryBaseUrl in appsettings/env).
      - BotConfig__SatisfactoryAdminPassword=${SATISFACTORY_ADMIN_PASSWORD}
      - BotConfig__SatisfactoryApiToken=${SATISFACTORY_API_TOKEN}
      # -- Ficsit Remote Monitoring (Satisfactory mod, separate HTTP server) --
      # Only needed for FRM's WRITE endpoints; all reads are unauthenticated.
      # Generated by the mod and stored in the game server's GameUserSettings.ini
      # under FicsitRemoteMonitoring.Server.uWS.AuthenticationToken. Treat as a
      # secret: it grants machine on/off and power-switch control. Keep out of git.
      - BotConfig__FrmAuthToken=${FRM_AUTH_TOKEN}
      # -- YouTube upload (VideoRepostHandler's "Upload" button) --
      # A user OAuth client + refresh token for the Google account that owns the
      # clan YouTube channel (a service account can't upload to YouTube). The
      # refresh token can post to the channel: keep it out of git.
      - BotConfig__YouTubeClientId=${YOUTUBE_CLIENT_ID}
      - BotConfig__YouTubeClientSecret=${YOUTUBE_CLIENT_SECRET}
      - BotConfig__YouTubeRefreshToken=${YOUTUBE_REFRESH_TOKEN}
      # -- Meeting recording (recorder sidecar) --
      - BotConfig__MeetingRecorderBaseUrl=http://recorder:8080
      - BotConfig__MeetingRecorderSharedSecret=${RECORDER_SHARED_SECRET}
      # -- Meeting minutes (transcriber sidecar + Claude) --
      # Setting MeetingTranscriberBaseUrl activates MeetingMinutesService.
      - BotConfig__MeetingTranscriberBaseUrl=http://transcriber:8090
      - BotConfig__MeetingTranscriberSharedSecret=${TRANSCRIBER_SHARED_SECRET}
      # Dedicated channel for posted minutes:
      - BotConfig__MeetingMinutesChannelId=1509712699414679602
      # Live: bot auto-joins/records/summarizes meetings whose title matches the pattern.
      # Case-insensitive substring regex. Clan meetings are titled e.g.
      # "189th June Leadership Meeting", so match leadership/monthly meetings.
      - BotConfig__MeetingRecordingEnabled=true
      - BotConfig__MeetingTitlePattern=(leadership|monthly) meeting
    volumes:
      - bot-data:/app/data
      - bot-logs:/app/logs
      # Shared recordings volume -- same path in all three containers.
      - meeting-audio:/app/data/recordings
      - ./google-credentials.json:/app/google-credentials.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  recorder:
    build: ./Recorder
    container_name: clanguard-recorder
    restart: unless-stopped
    # Idle draw is ~10MiB; it only grows while buffering voice packets during
    # a recording. 256m is generous for that.
    mem_limit: 256m
    memswap_limit: 256m
    # On SIGTERM the recorder finalizes an in-progress meeting (flushes tracks,
    # writes manifest.json), which can take ~20s. Docker's default 10s would
    # SIGKILL it partway through.
    stop_grace_period: 45s
    environment:
      - RECORDER_BOT_TOKEN=${RECORDER_BOT_TOKEN}
      - RECORDER_SHARED_SECRET=${RECORDER_SHARED_SECRET}
      - RECORDER_PORT=8080
      - AUDIO_ROOT=/app/data/recordings
    volumes:
      - meeting-audio:/app/data/recordings
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  transcriber:
    build: ./Transcriber
    container_name: clanguard-transcriber
    restart: unless-stopped
    # app.py loads WhisperModel at import, not per request, so the model is
    # meant to stay resident for the life of the container. On the old 1 GB
    # box it did not: docker stats showed this container at 5.4MiB RSS, which
    # is less than an empty Python process, so the kernel had swapped the
    # model out and every meeting had to page it back off disk first.
    #
    # memswap_limit == mem_limit means no swap at all for this container,
    # which is the point: a resident model is the whole reason it is loaded
    # up front. base.en at int8 is small, so 640m is well clear of what it
    # needs and it should never reach the limit.
    #
    # If transcription ever starts failing after a model change (small.en or
    # larger), raise both numbers together rather than allowing swap back in.
    mem_limit: 640m
    memswap_limit: 640m
    environment:
      - TRANSCRIBER_SHARED_SECRET=${TRANSCRIBER_SHARED_SECRET}
      - TRANSCRIBER_PORT=8090
      - WHISPER_MODEL=base.en
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE=int8
    volumes:
      - meeting-audio:/app/data/recordings
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  sixlabors_license:
    file: ./sixlabors.lic

volumes:
  bot-data:
  bot-logs:
  meeting-audio: