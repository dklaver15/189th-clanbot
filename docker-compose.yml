services:
  clanguard:
    build: .
    container_name: clanguard-bot
    restart: unless-stopped
    depends_on:
      - recorder
      - transcriber
    environment:
      - DOTNET_ENVIRONMENT=Production
      - BotConfig__Token=${DISCORD_BOT_TOKEN}
      - Claude__ApiKey=${ANTHROPIC_API_KEY}
      - BotConfig__BackupEncryptionPassphrase=${CLANGUARD_BACKUP_PASSPHRASE}
      - BotConfig__HeartbeatPingUrl=${CLANGUARD_HEARTBEAT_URL}
      # Cloudflare R2 credentials for the SQLite backup uploader.
      - BotConfig__BackupR2__AccessKeyId=${CLANGUARD_R2_ACCESS_KEY_ID}
      - BotConfig__BackupR2__SecretAccessKey=${CLANGUARD_R2_SECRET_ACCESS_KEY}
      # -- Meeting recording (recorder sidecar) --
      - BotConfig__MeetingRecorderBaseUrl=http://recorder:8080
      - BotConfig__MeetingRecorderSharedSecret=${RECORDER_SHARED_SECRET}
      # -- Meeting minutes (transcriber sidecar + Claude) --
      # Setting MeetingTranscriberBaseUrl activates MeetingMinutesService.
      - BotConfig__MeetingTranscriberBaseUrl=http://transcriber:8090
      - BotConfig__MeetingTranscriberSharedSecret=${TRANSCRIBER_SHARED_SECRET}
      # Optional: dedicated channel for posted minutes (else announcement channel -> meeting VC):
      - BotConfig__MeetingMinutesChannelId=1509712699414679602
      # Flip on once you're ready for the bot to actually join/record/summarize:
      # - BotConfig__MeetingRecordingEnabled=true
    volumes:
      - bot-data:/app/data
      - bot-logs:/app/logs
      # Shared recordings volume -- same path in all three containers.
      - meeting-audio:/app/data/recordings
      - ./google-credentials.json:/app/google-credentials.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  recorder:
    build: ./Recorder
    container_name: clanguard-recorder
    restart: unless-stopped
    environment:
      - RECORDER_BOT_TOKEN=${RECORDER_BOT_TOKEN}
      - RECORDER_SHARED_SECRET=${RECORDER_SHARED_SECRET}
      - RECORDER_PORT=8080
      - AUDIO_ROOT=/app/data/recordings
    volumes:
      - meeting-audio:/app/data/recordings
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  transcriber:
    build: ./Transcriber
    container_name: clanguard-transcriber
    restart: unless-stopped
    environment:
      - TRANSCRIBER_SHARED_SECRET=${TRANSCRIBER_SHARED_SECRET}
      - TRANSCRIBER_PORT=8090
      - WHISPER_MODEL=base.en
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE=int8
    volumes:
      - meeting-audio:/app/data/recordings
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
  bot-logs:
  meeting-audio: