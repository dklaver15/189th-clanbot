name: Deploy to Droplet
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: GOOGLE_CREDENTIALS_BASE64,GITHUB_PAT
          script: |
            cd /opt/clanguard
            git remote set-url origin https://$GITHUB_PAT@github.com/YOUR_USERNAME/YOUR_REPO.git
            git fetch origin main
            git reset --hard origin/main
            echo "$GOOGLE_CREDENTIALS_BASE64" | base64 --decode > google-credentials.json
            docker compose up -d --build
        env:
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
