name: Deploy to Droplet
on:
  push:
    branches: [main]

# Deploys run one at a time. Two pushes in quick succession used to start two
# concurrent SSH deploys against the SAME droplet, each running
# `docker compose build --no-cache` for all three images — they contended for the
# box's CPU and the Docker daemon and took far longer than 2x a single deploy.
#
# cancel-in-progress is deliberately FALSE. Cancelling the GitHub job only kills
# the SSH session; the `docker compose build` it kicked off keeps running on the
# droplet regardless. So "cancel" would leave the orphaned build going AND start a
# second one — precisely the contention we're trying to prevent. Queuing instead
# means the second deploy waits its turn and then resets to the newest main, so
# the extra wait costs nothing: both deploys would have landed on the same commit
# anyway (the script does `git reset --hard origin/main`, not a checkout of the
# pushed SHA).
concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          # Default command_timeout is 10m. Builds used to run --no-cache across
          # all three images, and the transcriber (pip install + a build-time
          # HuggingFace model download) regularly pushed total build time past
          # 10m → "Run Command Timeout". The sidecars now use layer cache (see
          # the build steps below), so typical deploys are much shorter, but 30m
          # stays: a dependency change in the transcriber still triggers the full
          # slow path, and the droplet is a single shared vCPU.
          command_timeout: 30m
          envs: GOOGLE_CREDENTIALS_BASE64,ANTHROPIC_API_KEY
          script: |
            cd /opt/clanguard
            git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/dklaver15/189th-clanbot.git
            git fetch origin main
            git reset --hard origin/main
            echo "$GOOGLE_CREDENTIALS_BASE64" | base64 --decode > google-credentials.json
            # --no-cache is deliberate on clanguard and ONLY on clanguard.
            #
            # We hit builds where the running bot did not reflect pushed code
            # changes, and rebuilding this image from scratch every deploy is
            # what stopped it. This is the image whose source actually changes on
            # every push, so it is the one that needs the guarantee. Do not
            # "optimise" this back to a cached build.
            docker compose build --no-cache clanguard
            #
            # The sidecars are a different story. Their inputs are
            # Transcriber/requirements.txt and Recorder/package.json, which
            # change maybe a few times a year, and neither was involved in the
            # stale-build problem above. Rebuilding them from scratch on every
            # push meant re-running pip install AND re-downloading the whisper
            # model from HuggingFace (see the RUN python -c line in
            # Transcriber/Dockerfile), plus a full npm install, on a single
            # shared vCPU. That was the bulk of every deploy.
            #
            # Layer cache invalidates correctly when those dependency files
            # change, so this stays honest. If a sidecar ever does go stale,
            # rebuild it explicitly on the droplet rather than putting
            # --no-cache back across the board:
            #   docker compose build --no-cache transcriber
            docker compose build recorder transcriber
            docker compose up -d --force-recreate
        env:
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}