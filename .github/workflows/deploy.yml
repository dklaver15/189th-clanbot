name: Deploy to Droplet
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: GOOGLE_CREDENTIALS_BASE64,ANTHROPIC_API_KEY,REDDIT_CLIENT_SECRET,REDDIT_PASSWORD
          script: |
            cd /opt/clanguard
            git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/dklaver15/189th-clanbot.git
            git fetch origin main
            git reset --hard origin/main
            echo "$GOOGLE_CREDENTIALS_BASE64" | base64 --decode > google-credentials.json
            docker compose build --no-cache
            docker compose up -d --force-recreate
        env:
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
